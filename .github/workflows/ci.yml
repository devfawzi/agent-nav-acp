name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      # localIdePath (gradle.properties) n'existe pas en CI → fallback téléchargement
      - name: Build plugin
        run: ./gradlew buildPlugin --no-daemon

      - name: Verify plugin
        run: ./gradlew verifyPluginProjectConfiguration --no-daemon
